# ============================================================
#  AI赛事备忘录 —— nginx 站点配置（参考）
#
#  ★ 请先读这三行：
#    1. 这份配置【没有在本机实测过】（本机没装 nginx，测不了）。
#       它的每一条规则都是照着 deploy\static-preview.js 写的，
#       而那个预览是本机实测过的 —— 所以规则本身是准的，但你上线那天要按
#       deploy\上线清单.md 第三节逐条肉眼验一遍。
#    2. 如果你用宝塔面板，【优先用面板点点点】（见上线清单），
#       面板会自动生成一份 nginx 配置；这份只用来对照"面板里少了哪条"。
#    3. 把 __DOMAIN__ 换成你的真域名，把 __ROOT__ 换成网站根目录
#       （宝塔默认是 /www/wwwroot/你的域名）。
#
#  【这份配置在做什么】服务器上不跑任何程序，只把做好的 html 文件发出去。
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root __ROOT__;
    index index.html;
    charset utf-8;

    # ---------- 1. 地址里带 .. 的一律拒绝 ----------
    # （和本机 server.js / static-preview.js 同一条规矩：
    #   防止有人用 ../../ 跳出网站目录去翻服务器上别的文件）
    if ($request_uri ~ "\.\.") {
        return 400;
    }

    # ---------- 2. 隐藏文件一律不给 ----------
    location ~ /\. {
        deny all;
    }

    # ---------- 3. 详情页：文件不存在就 404 ----------
    # 为什么不能让它悄悄发首页：观众点"详情"却拿到首页，会以为网站坏了。
    location ^~ /detail/ {
        try_files $uri =404;
    }

    # ---------- 4. 其余地址：找不到就把首页发出去 ----------
    # （和本机网站行为一致：随便打一个地址不会白页）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 5. html 每次都要最新的 ----------
    # 你更新完网站后，观众不该还看到好几天前的旧页面。
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---------- 6. 压缩（页面是纯文本，压完小很多） ----------
    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript text/plain text/xml image/svg+xml;

    # ---------- 7. 顺手关掉不需要的东西 ----------
    # 本站没有任何上传、也没有【服务器端】脚本，这几行是"用不到就别开门"。
    # ★ 2026-09-16 晚更正：首页现在多了一段筛选脚本，但那是【观众浏览器里跑的】，
    #   服务器依然只负责发文件、不执行任何东西 —— 所以这里的规矩一个字都不用改，
    #   只是原来那句"没有任何……脚本"说得太满了，改准。
    location ~* \.(?:bak|conf|log|sql|sh|zip)$ {
        deny all;
    }
}

